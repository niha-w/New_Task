rules:
- id: sensitive-data-leak.contact_email
  mode: taint
  languages:
  - python
  severity: ERROR
  message: 'Possible leak of sensitive column ''contact_email'' (category: pii). Present in: customer_orders_view,
    vip_view. Derived from base column(s): customers.email. Sensitive values must not reach print/log/HTTP-response/return
    sinks without explicit review.'
  metadata:
    category: security
    subcategory:
    - data-leak
    confidence: MEDIUM
    sensitivity_categories:
    - pii
    tables:
    - customer_orders_view
    - vip_view
    column_provenance:
    - derived
    derived_from:
    - customers.email
    owasp:
    - A01:2021 - Broken Access Control
    - A09:2021 - Security Logging and Monitoring Failures
  options:
    symbolic_propagation: true
  pattern-sources:
  - pattern: '"contact_email"'
  - pattern: $OBJ["contact_email"]
  - pattern: $OBJ.contact_email
  - patterns:
    - pattern: '"$STR"'
    - metavariable-regex:
        metavariable: $STR
        regex: (?is).*contact_email.*
  pattern-propagators:
  - pattern: $CURSOR.execute($QUERY, ...)
    from: $QUERY
    to: $CURSOR
  - pattern: $CURSOR.fetchone()
    from: $CURSOR
    to: $CURSOR
  - pattern: $CURSOR.fetchall()
    from: $CURSOR
    to: $CURSOR
  - pattern: $CURSOR.fetchmany(...)
    from: $CURSOR
    to: $CURSOR
  pattern-sinks:
  - pattern: print(...)
  - pattern: logging.$METHOD(...)
  - patterns:
    - pattern: $LOGGER.$METHOD(...)
    - metavariable-regex:
        metavariable: $LOGGER
        regex: (?i)^(self\.)?(logger|log)$
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(debug|info|warning|warn|error|critical|exception|log)$
  - pattern: requests.$METHOD(...)
  - pattern: return ...
